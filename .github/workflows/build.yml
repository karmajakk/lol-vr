name: Compiler l'APK

# Chaque envoi de code est compilé pour vérifier qu'il fonctionne.
# Une version n'est publiée que lorsqu'on crée une étiquette « vX.Y.Z » :
# l'APK est alors joint à la publication et les notes viennent de CHANGELOG.md.
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Récupérer le code
        run: |
          git clone --no-checkout "https://github.com/${GITHUB_REPOSITORY}.git" .
          git checkout --quiet "${GITHUB_SHA}"

      - name: Construire l'APK
        run: |
          export LOLVR_VERSION_CODE="${GITHUB_RUN_NUMBER}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            export LOLVR_VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            export LOLVR_VERSION_NAME="dev-${GITHUB_RUN_NUMBER}"
          fi
          scripts/build.sh

      - name: Publier la version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Notes = la section « ## [X.Y.Z] » du CHANGELOG.md
          awk -v v="[$VERSION]" '
            /^## / { if (found) exit; if (index($0, v)) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "Version ${VERSION}. Installez lol-vr.apk avec SideQuest." > notes.md
          fi
          echo "" >> notes.md
          echo "Installation : téléchargez \`lol-vr.apk\` ci-dessous et installez-le avec SideQuest, par-dessus l'ancienne version (les sauvegardes sont conservées)." >> notes.md
          gh release delete "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --yes || true
          gh release create "$GITHUB_REF_NAME" build/lol-vr.apk --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "Lands of Lore VR ${VERSION}" --notes-file notes.md --latest
